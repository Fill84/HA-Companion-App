name: Verify desktop on Forgejo

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: desktop-app/yarn.lock
      - run: corepack enable
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Check web assets and frontend behavior
        working-directory: desktop-app
        run: |
          yarn install --frozen-lockfile
          node --test tests/*.cjs
          node build-web.js
      - name: Check Rust formatting and behavior
        working-directory: desktop-app/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
      - name: Check integrated Windows sensor components
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node desktop-app/verify-pawnio.js
          cargo fmt --all --manifest-path desktop-app/sensor-core/Cargo.toml -- --check
          cargo clippy --locked --manifest-path desktop-app/sensor-core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop-app/sensor-core/Cargo.toml
          cargo fmt --all --manifest-path desktop-app/sensor-service/Cargo.toml -- --check
          cargo clippy --locked --manifest-path desktop-app/sensor-service/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop-app/sensor-service/Cargo.toml
