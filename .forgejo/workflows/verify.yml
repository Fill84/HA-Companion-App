name: Verify desktop on Forgejo

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Configure Microsoft C++ tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Install Microsoft C++ Build Tools with Desktop development with C++ on this runner.' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'No Visual C++ x64 toolchain was found on this runner.' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'The Visual C++ x64 environment script is missing.' }
          $env:PATH = "$(Split-Path -Parent $vswhere);$env:PATH"
          $variables = & cmd.exe /d /s /c ('call "' + $vcvars + '" >nul && set')
          if ($LASTEXITCODE -ne 0) { throw 'Visual C++ environment setup failed.' }
          $names = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion')
          foreach ($name in $names) {
            $line = $variables | Where-Object { $_ -like "$name=*" } | Select-Object -First 1
            if ($line) {
              $value = $line.Substring($line.IndexOf('=') + 1)
              Set-Item -Path "Env:$name" -Value $value
              Add-Content -LiteralPath $env:FORGEJO_ENV -Value "$name=$value"
            }
          }
          if (-not (Get-Command link.exe -ErrorAction SilentlyContinue)) { throw 'Visual C++ linker link.exe is not available after vcvars64.bat.' }
      - run: corepack enable
        shell: pwsh
      - name: Install web dependencies
        working-directory: desktop-app
        shell: pwsh
        run: yarn install --frozen-lockfile
      - name: Build web assets
        working-directory: desktop-app
        shell: pwsh
        run: node build-web.js
      - name: Test frontend behavior
        working-directory: desktop-app
        shell: pwsh
        run: node --test (Get-ChildItem -LiteralPath tests -Filter '*.cjs' -File | ForEach-Object FullName)
      - name: Check Rust formatting
        working-directory: desktop-app/src-tauri
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        working-directory: desktop-app/src-tauri
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust behavior
        working-directory: desktop-app/src-tauri
        shell: pwsh
        run: cargo test --locked --lib
      - name: Verify bundled Windows driver
        shell: pwsh
        run: node desktop-app/verify-pawnio.js
      - name: Check Windows sensor-core formatting
        shell: pwsh
        run: cargo fmt --all --manifest-path desktop-app/sensor-core/Cargo.toml -- --check
      - name: Check Windows sensor-core lint
        shell: pwsh
        run: cargo clippy --locked --manifest-path desktop-app/sensor-core/Cargo.toml --all-targets -- -D warnings
      - name: Test Windows sensor-core
        shell: pwsh
        run: cargo test --locked --manifest-path desktop-app/sensor-core/Cargo.toml
      - name: Check Windows sensor-service formatting
        shell: pwsh
        run: cargo fmt --all --manifest-path desktop-app/sensor-service/Cargo.toml -- --check
      - name: Check Windows sensor-service lint
        shell: pwsh
        run: cargo clippy --locked --manifest-path desktop-app/sensor-service/Cargo.toml --all-targets -- -D warnings
      - name: Test Windows sensor-service
        shell: pwsh
        run: cargo test --locked --manifest-path desktop-app/sensor-service/Cargo.toml

  unix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
        shell: bash
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install web dependencies
        working-directory: desktop-app
        shell: bash
        run: yarn install --frozen-lockfile
      - name: Build web assets
        working-directory: desktop-app
        shell: bash
        run: node build-web.js
      - name: Test frontend behavior
        working-directory: desktop-app
        shell: bash
        run: node --test tests/*.cjs
      - name: Check Rust formatting
        working-directory: desktop-app/src-tauri
        shell: bash
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        working-directory: desktop-app/src-tauri
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust behavior
        working-directory: desktop-app/src-tauri
        shell: bash
        run: cargo test --locked --lib
