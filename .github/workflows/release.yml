name: Cross-platform Release

on:
  workflow_dispatch:
    inputs:
      integration_commit:
        description: Full 40-character commit SHA from Fill84/ha-integration
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read release version from package.json
        id: get_version
        env:
          INTEGRATION_COMMIT: ${{ inputs.integration_commit }}
        run: |
          # Single source of truth: desktop-app/package.json. Bump it in the
          # commit that you want released. The workflow refuses to overwrite
          # an existing tag, so accidental re-releases are caught early
          # instead of silently rewriting old releases.
          VERSION=$(node -p "require('./desktop-app/package.json').version")
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not read version from desktop-app/package.json"
            exit 1
          fi
          NATIVE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('desktop-app/src-tauri/Cargo.toml', 'rb'))['package']['version'])")
          CONFIG_VERSION=$(node -p "require('./desktop-app/src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$NATIVE_VERSION" ] || [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "ERROR: package.json ($VERSION), Cargo.toml ($NATIVE_VERSION), and tauri.conf.json ($CONFIG_VERSION) must match"
            exit 1
          fi
          if ! [[ "$INTEGRATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: integration_commit must be a full lowercase commit SHA"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "ERROR: tag '$VERSION' already exists. Bump desktop-app/package.json before pushing."
            exit 1
          fi
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-windows:
    runs-on: windows-latest
    needs: version
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: desktop-app/yarn.lock
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable

      - name: Import code signing certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No certificate provided, skipping code signing setup"
            exit 0
          }
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          echo "CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item $certPath

      - name: Configure code signing in Tauri config
        if: env.CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: |
          $conf = Get-Content desktop-app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -Depth 10
          $conf.bundle.windows | Add-Member -NotePropertyName "certificateThumbprint" -NotePropertyValue $env:CERTIFICATE_THUMBPRINT -Force
          $conf.bundle.windows | Add-Member -NotePropertyName "digestAlgorithm" -NotePropertyValue "sha256" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName "timestampUrl" -NotePropertyValue "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 10 | Set-Content desktop-app/src-tauri/tauri.conf.json

      - name: Verify desktop contracts and dependencies
        shell: pwsh
        run: |
          cd desktop-app
          yarn install --frozen-lockfile
          yarn audit --level moderate
          node build-web.js
          node --test (Get-ChildItem -LiteralPath tests -Filter '*.cjs' -File | ForEach-Object FullName)
          node build-sensors.js
          cd src-tauri
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
          cd ../..
          node desktop-app/verify-pawnio.js
          cargo fmt --all --manifest-path desktop-app/sensor-core/Cargo.toml -- --check
          cargo clippy --locked --manifest-path desktop-app/sensor-core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop-app/sensor-core/Cargo.toml
          cargo fmt --all --manifest-path desktop-app/sensor-service/Cargo.toml -- --check
          cargo clippy --locked --manifest-path desktop-app/sensor-service/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop-app/sensor-service/Cargo.toml
          cd desktop-app/src-tauri
          cargo install cargo-audit --version 0.22.2 --locked
          # battery 0.7.8 references nix 0.19 only on FreeBSD/DragonFlyBSD.
          # Neither OS is in this release target matrix; Linux/macOS/Windows
          # cargo tree -i nix@0.19.1 contains no executable dependency.
          cargo audit --ignore RUSTSEC-2021-0119

      - name: Build desktop app
        run: |
          cd desktop-app
          yarn install --frozen-lockfile
          yarn tauri:build

      - name: Record Windows code-signing status
        shell: pwsh
        run: |
          $exe = 'desktop-app/src-tauri/target/release/ha-companion.exe'
          $installers = @(Get-ChildItem 'desktop-app/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if (-not (Test-Path -LiteralPath $exe) -or $installers.Count -ne 1) {
            throw 'Expected one Windows app executable and one NSIS installer.'
          }
          $files = @((Get-Item -LiteralPath $exe)) + $installers
          $statuses = @($files | ForEach-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status.ToString() })
          if ($statuses[0] -ne $statuses[1] -or $statuses[0] -notin @('Valid', 'NotSigned')) {
            throw "Windows app and installer must both have valid signatures or both be unsigned: $($statuses -join ', ')"
          }
          $status = $statuses[0]
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          @{ status = $status; files = @($files | ForEach-Object { $_.Name }) } |
            ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 release-artifacts/windows-signing.json
          if ($status -eq 'NotSigned') {
            Write-Warning 'Windows app and installer are unsigned. The release notes must disclose this.'
          } else {
            Write-Host 'Windows app and installer have valid Authenticode signatures.'
          }

      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts/nsis
          Copy-Item desktop-app/src-tauri/target/release/bundle/nsis/*.exe release-artifacts/nsis/
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release-artifacts

  build-macos:
    runs-on: macos-latest
    needs: version
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Convert app icon to RGBA (required for macOS)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python -c "
          from PIL import Image
          import os
          icons_dir = 'desktop-app/src-tauri/icons'
          for name in os.listdir(icons_dir):
              if name.endswith('.png'):
                  path = os.path.join(icons_dir, name)
                  img = Image.open(path)
                  if img.mode != 'RGBA':
                      img = img.convert('RGBA')
                      img.save(path)
          "
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: desktop-app/yarn.lock
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify macOS desktop contracts
        run: |
          cd desktop-app
          yarn install --frozen-lockfile
          node --test tests/*.cjs
          cd src-tauri
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib

      - name: Build desktop app
        run: |
          cd desktop-app
          yarn install --frozen-lockfile
          yarn tauri:build
      - name: Stage macOS Artifacts
        run: |
          mkdir -p release-artifacts/dmg
          cp desktop-app/src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/dmg/
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: release-artifacts

  build-linux:
    runs-on: ubuntu-latest
    needs: version
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Convert app icon to RGBA (required for Tauri)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python -c "
          from PIL import Image
          import os
          icons_dir = 'desktop-app/src-tauri/icons'
          for name in os.listdir(icons_dir):
              if name.endswith('.png'):
                  path = os.path.join(icons_dir, name)
                  img = Image.open(path)
                  if img.mode != 'RGBA':
                      img = img.convert('RGBA')
                      img.save(path)
          "
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: desktop-app/yarn.lock
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Linux desktop contracts
        run: |
          cd desktop-app
          yarn install --frozen-lockfile
          node --test tests/*.cjs
          cd src-tauri
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib

      - name: Build desktop app
        run: |
          cd desktop-app
          yarn install --frozen-lockfile
          yarn tauri:build
      - name: Stage Linux Artifacts
        run: |
          mkdir -p release-artifacts/deb release-artifacts/rpm release-artifacts/appimage
          cp desktop-app/src-tauri/target/release/bundle/deb/*.deb release-artifacts/deb/
          cp desktop-app/src-tauri/target/release/bundle/rpm/*.rpm release-artifacts/rpm/
          cp desktop-app/src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/appimage/
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: release-artifacts

  build-integration:
    runs-on: ubuntu-latest
    needs: version
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout ha-integration repo
        uses: actions/checkout@v4
        with:
          repository: Fill84/ha-integration
          ref: ${{ inputs.integration_commit }}
          persist-credentials: false
      - name: Verify integration source and manifest
        shell: bash
        env:
          INTEGRATION_COMMIT: ${{ inputs.integration_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$INTEGRATION_COMMIT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/desktop_app/manifest.json').read_text())
          assert manifest['version']
          print('Integration version:', manifest['version'])
          PY
      - name: Checkout desktop protocol fixture
        uses: actions/checkout@v4
        with:
          path: desktop-source
          persist-credentials: false
      - name: Verify shared protocol fixture
        run: cmp contracts/protocol-v1.json desktop-source/contracts/protocol-v1.json
      - name: Test integration contracts
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest -q tests
      - name: Build integration zip
        run: |
          zip -r ha-integration.zip custom_components hacs.json README.md
      - name: Upload Integration Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-integration
          path: ha-integration.zip

  release:
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-macos, build-linux, build-integration]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: windows-installers
      - uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: macos-installers
      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: linux-installers
      - uses: actions/download-artifact@v4
        with:
          name: ha-integration
          path: ha-integration
      - name: Write reproducible source and artifact manifest
        env:
          DESKTOP_VERSION: ${{ needs.version.outputs.version }}
          DESKTOP_COMMIT: ${{ github.sha }}
          INTEGRATION_COMMIT: ${{ inputs.integration_commit }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          roots = ['windows-installers', 'macos-installers', 'linux-installers', 'ha-integration']
          signing = json.loads(Path('windows-installers/windows-signing.json').read_text(encoding='utf-8-sig'))
          if signing['status'] not in ('Valid', 'NotSigned') or len(signing['files']) != 2:
              raise SystemExit('Windows signing status is invalid or incomplete')
          artifacts = {}
          for root in roots:
              for path in sorted(Path(root).rglob('*')):
                  if path.is_file():
                      digest = hashlib.sha256()
                      with path.open('rb') as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                              digest.update(chunk)
                      artifacts[path.as_posix()] = digest.hexdigest()
          if not artifacts or not any(path.endswith('ha-integration.zip') for path in artifacts):
              raise SystemExit('Release artifacts are incomplete')
          with ZipFile('ha-integration/ha-integration.zip') as archive:
              integration_version = json.loads(
                  archive.read('custom_components/desktop_app/manifest.json')
              )['version']
          manifest = {
              'desktop_version': os.environ['DESKTOP_VERSION'],
              'integration_version': integration_version,
              'desktop_commit': os.environ['DESKTOP_COMMIT'],
              'integration_commit': os.environ['INTEGRATION_COMMIT'],
              'windows_authenticode_status': signing['status'],
              'artifacts_sha256': artifacts,
          }
          Path('release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          if signing['status'] == 'NotSigned':
              windows_note = (
                  'De Windows-app en -installer zijn niet Authenticode-ondertekend. '
                  'Windows kan daarom Onbekende uitgever of een SmartScreen-waarschuwing tonen. '
                  'Download uitsluitend vanaf deze releasepagina en vergelijk de SHA-256 van het '
                  'bestand met release-manifest.json. De meegeleverde PawnIO-driver heeft een '
                  'afzonderlijke handtekening van zijn leverancier.'
              )
          else:
              windows_note = 'De Windows-app en -installer hebben geldige Authenticode-handtekeningen.'
          Path('release-notes.md').write_text(
              f'## Windows-installatie\n\n{windows_note}\n\n'
              'De broncommits en SHA-256-controlesommen voor alle downloads staan in '
              '`release-manifest.json`.\n', encoding='utf-8'
          )
          PY
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          # Source files (package.json etc.) are the source of truth, so the
          # workflow no longer pushes a "chore: set version" commit back to
          # main. Bump the version in your release commit; the workflow tags
          # whatever HEAD already says.
          files: |
            windows-installers/nsis/*.exe
            macos-installers/dmg/*.dmg
            linux-installers/deb/*.deb
            linux-installers/rpm/*.rpm
            linux-installers/appimage/*.AppImage
            ha-integration/ha-integration.zip
            windows-installers/windows-signing.json
            release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
